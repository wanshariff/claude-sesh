<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 16px;
    font: 12px/1.45 Inter, system-ui, sans-serif;
    color: var(--figma-color-text, #222);
    background: var(--figma-color-bg, #fff);
  }
  h1 { font-size: 13px; font-weight: 600; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--figma-color-text-secondary, #666); }
  code { font-family: ui-monospace, monospace; font-size: 11px; }
  .drop {
    border: 1px dashed var(--figma-color-border-strong, #bbb);
    border-radius: 6px; padding: 24px 12px; text-align: center; cursor: pointer;
    color: var(--figma-color-text-secondary, #666);
  }
  .drop.over { border-color: var(--figma-color-border-brand-strong, #0d99ff); background: var(--figma-color-bg-brand-tertiary, #e5f4ff); }
  .meta { margin: 12px 0; padding: 8px 10px; border-radius: 6px; background: var(--figma-color-bg-secondary, #f5f5f5); display: none; }
  .meta div { display: flex; justify-content: space-between; gap: 8px; }
  .meta span:first-child { color: var(--figma-color-text-secondary, #666); }
  .meta span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button {
    width: 100%; height: 32px; border: 0; border-radius: 6px; font: inherit; font-weight: 500;
    background: var(--figma-color-bg-brand, #0d99ff); color: var(--figma-color-text-onbrand, #fff); cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  .status { margin-top: 12px; min-height: 18px; }
  .status.error { color: var(--figma-color-text-danger, #e03e1a); }
  .warn { margin-top: 8px; color: var(--figma-color-text-warning, #b86200); }
  input[type=file] { display: none; }
</style>

<h1>Import a web capture</h1>
<p>Run <code>npm run capture -- &lt;url&gt;</code> to create a <code>.figma.json</code>, then drop it here.</p>

<label class="drop" id="drop">
  Drop a <code>.figma.json</code> file or click to choose
  <input type="file" id="file" accept=".json,application/json" />
</label>

<div class="meta" id="meta"></div>
<button id="go" disabled>Import</button>
<div class="status" id="status"></div>

<script>
  const $ = (id) => document.getElementById(id);
  let doc = null;

  function load(file) {
    $('status').textContent = 'Reading…';
    $('status').className = 'status';
    const reader = new FileReader();
    reader.onload = () => {
      try {
        doc = JSON.parse(reader.result);
        if (doc.format !== 'web2figma') throw new Error('Not a web2figma capture file.');
      } catch (e) {
        doc = null;
        $('go').disabled = true;
        $('meta').style.display = 'none';
        $('status').textContent = e.message;
        $('status').className = 'status error';
        return;
      }
      const rows = [
        ['Source', doc.source],
        ['Frames', doc.captures.map((c) => c.label).join(', ')],
        ['Elements', doc.captures.reduce((s, c) => s + c.nodeCount, 0).toLocaleString()],
        ['Images', Object.keys(doc.images || {}).length],
        ['Captured', new Date(doc.capturedAt).toLocaleString()],
      ];
      $('meta').innerHTML = '';
      for (const [k, v] of rows) {
        const row = document.createElement('div');
        const a = document.createElement('span'); a.textContent = k;
        const b = document.createElement('span'); b.textContent = v; b.title = v;
        row.append(a, b);
        $('meta').append(row);
      }
      $('meta').style.display = 'block';
      $('go').disabled = false;
      $('status').textContent = '';
    };
    reader.readAsText(file);
  }

  $('file').onchange = (e) => e.target.files[0] && load(e.target.files[0]);
  const drop = $('drop');
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = (e) => {
    e.preventDefault();
    drop.classList.remove('over');
    if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);
  };

  $('go').onclick = () => {
    $('go').disabled = true;
    $('status').className = 'status';
    $('status').textContent = 'Building layers…';
    parent.postMessage({ pluginMessage: { type: 'import', doc } }, '*');
  };

  onmessage = (e) => {
    const msg = e.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'progress') {
      $('status').textContent = `Building layers… ${msg.nodes.toLocaleString()}`;
    } else if (msg.type === 'done') {
      const r = msg.result;
      $('status').innerHTML = '';
      const ok = document.createElement('div');
      ok.textContent = `Done — ${r.nodes.toLocaleString()} layers, ${r.images} images, ${r.frames} frame(s).`;
      $('status').append(ok);
      const warns = [];
      if (r.missingFonts.length) warns.push(`Fonts not installed (substituted with closest match): ${r.missingFonts.join(', ')}`);
      if (r.svgFailures) warns.push(`${r.svgFailures} SVG(s) could not be parsed.`);
      if (r.textFailures) warns.push(`${r.textFailures} text layer(s) failed.`);
      for (const w of warns) {
        const d = document.createElement('div');
        d.className = 'warn';
        d.textContent = w;
        $('status').append(d);
      }
      $('go').disabled = false;
    } else if (msg.type === 'error') {
      $('status').textContent = msg.message;
      $('status').className = 'status error';
      $('go').disabled = false;
    }
  };
</script>
